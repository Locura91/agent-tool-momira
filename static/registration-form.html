<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register your interest — {{PKG_TITLE}}</title>
  <style>
    :root {
      --brand: #17a39b;
      --brand-dark: #128a81;
      --brand-light: #e6f7f6;
      --ink: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --white: #ffffff;
      --red: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
    }
    .card-header {
      background: var(--brand);
      padding: 1.6rem 2rem;
      color: #fff;
    }
    .agency-logo {
      height: 40px;
      object-fit: contain;
      margin-bottom: .8rem;
      display: block;
      border-radius: 4px;
    }
    .card-header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: .2rem;
    }
    .card-header .dest {
      font-size: .85rem;
      opacity: .85;
    }
    .card-header .price {
      margin-top: .4rem;
      font-size: 1rem;
      font-weight: 700;
      opacity: .95;
    }
    .card-body { padding: 1.8rem 2rem; }
    .card-body p.intro {
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
      line-height: 1.5;
    }
    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: .35rem;
    }
    label .req { color: var(--red); margin-left: 2px; }
    input, select {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: .65rem .9rem;
      font-size: .95rem;
      color: var(--ink);
      background: var(--white);
      transition: border-color .15s;
      appearance: none;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--brand);
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .btn-submit {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .85rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .4rem;
      transition: background .15s;
    }
    .btn-submit:hover { background: var(--brand-dark); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .footer {
      margin-top: 2rem;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 480px) {
      .card-body { padding: 1.4rem 1.2rem; }
      .card-header { padding: 1.2rem 1.4rem; }
      .row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    {{LOGO_HTML}}
    <h1>{{PKG_TITLE}}</h1>
    <div class="dest">{{PKG_DEST}}</div>
    <div class="price">{{PRICE_STR}}</div>
  </div>

  <div class="card-body">
    <p class="intro">Please fill in your details below. {{AGENCY_NAME}} will contact you with all the information about this holiday.</p>

    <form method="POST" action="/register/{{AGENT_ID}}/{{PACKAGE_ID}}" id="reg-form">
      <div class="row-2">
        <div class="form-group">
          <label>First name <span class="req">*</span></label>
          <input type="text" name="first_name" required autocomplete="given-name">
        </div>
        <div class="form-group">
          <label>Last name <span class="req">*</span></label>
          <input type="text" name="last_name" required autocomplete="family-name">
        </div>
      </div>

      <div class="form-group">
        <label>E-mail address <span class="req">*</span></label>
        <input type="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>Phone number</label>
        <input type="tel" name="phone" autocomplete="tel" placeholder="+49 …">
      </div>

      <div class="form-group">
        <label>Nationality</label>
        <input type="text" name="nationality" placeholder="e.g. German">
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Register my interest →</button>
    </form>
  </div>
</div>

<div class="footer">Powered by {{AGENCY_NAME}} · Travel Agent Kit</div>

<script>
  document.getElementById('reg-form').addEventListener('submit', function() {
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
  });
</script>
</body>
</html>
