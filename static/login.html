  </div>
</div>

<script>
  (async () => {
    try {
      const res = await fetch('/auth/guest', { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('sk_token', data.access_token);
        window.location.href = '/dashboard';
      }
    } catch (e) {}
  })();
</script>
</body>
