<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Agent Kit — Login</title>
  <style>
    :root {
      --brand: #17a39b;
      --brand-dark: #128a81;
      --ink: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --white: #ffffff;
      --red: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 2rem;
    }
    .logo img { height: 44px; width: 44px; border-radius: 50%; object-fit: contain; display: block; }
    .logo-text { font-weight: 700; font-size: 1.1rem; color: var(--ink); }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .35rem; }
    .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 1.8rem; }
    label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .35rem; }
    input[type=email], input[type=password] {
      width: 100%;
      padding: .65rem .9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      color: var(--ink);
      margin-bottom: 1.1rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--brand); }
    .btn {
      width: 100%;
      padding: .75rem;
      background: var(--brand);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: var(--red);
      border-radius: 8px;
      padding: .6rem .9rem;
      font-size: .85rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/static/momira-logo.png" alt="Momira Travel">
    <span class="logo-text">Travel Agent Kit</span>
  </div>
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to your travel agency account.</p>

  <div class="error" id="login-error"></div>
  <label for="login-email">Email</label>
  <input type="email" id="login-email" placeholder="you@youragency.com" autocomplete="email">
  <label for="login-password">Password</label>
  <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
  <button class="btn" id="login-btn">Log in</button>
</div>

<script>
  // If already logged in, send to the right page right away
  const token = localStorage.getItem('sk_token');
  const savedRole = localStorage.getItem('sk_role');
  if (token) {
    window.location.href = '/dashboard';
  }

  function showError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Allow submitting with Enter
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    document.getElementById('login-error').style.display = 'none';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showError('Please fill in both fields.'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Logging in…';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showError(data.detail || 'Login failed. Check your email and password.'); return; }

      localStorage.setItem('sk_token', data.access_token);
      localStorage.setItem('sk_role', data.role || 'agent');

      window.location.href = '/dashboard';
    } catch (e) {
      showError('Could not reach the server. Please try again.');
    } finally {
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
