<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Agent Kit — Customer Trips</title>
  <style>
    :root {
      --brand: #17a39b; --brand-dark: #128a81; --brand-light: #e6f7f6;
      --ink: #111827; --muted: #6b7280; --border: #e5e7eb;
      --bg: #f9fafb; --white: #fff;
      --green: #16a34a; --green-bg: #dcfce7;
      --amber: #d97706; --amber-bg: #fef3c7;
      --blue: #2563eb; --blue-bg: #dbeafe;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh; }

    nav { background: var(--white); border-bottom: 1px solid var(--border);
      padding: 0 1.5rem; display: flex; align-items: center;
      justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--ink); }
    .logo img { height: 36px; width: 36px; border-radius: 50%; object-fit: contain; display: block; }
    .logo-text { font-weight: 700; font-size: 1rem; }
    .nav-right { display: flex; align-items: center; gap: .8rem; }
    .btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: .4rem .8rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
    .btn-ghost:hover { background: var(--bg); }

    .page { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }
    .back { font-size: .85rem; color: var(--brand); text-decoration: none;
      display: inline-flex; align-items: center; gap: .3rem; margin-bottom: 1.5rem; }
    .back:hover { text-decoration: underline; }
    .page-header { margin-bottom: 2rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; }
    .page-header p { color: var(--muted); font-size: .9rem; margin-top: .3rem; }

    .btn-brand { background: var(--brand); color: #fff; border: none; border-radius: 10px;
      padding: .6rem 1.1rem; font-size: .88rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-brand:hover { background: var(--brand-dark); }

    /* Add booking form */
    .add-card { background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.6rem; margin-bottom: 2rem; display: none; }
    .add-card.open { display: block; }
    .add-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1.2rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; color: var(--ink); }
    label .req { color: #dc2626; }
    input[type=text], input[type=email], input[type=date] {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: .6rem .85rem; font-size: .9rem; color: var(--ink); background: var(--white); }
    input:focus { outline: none; border-color: var(--brand); }
    .form-actions { display: flex; gap: .7rem; margin-top: 1rem; }
    .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: .6rem 1rem; font-size: .88rem; color: var(--muted); cursor: pointer; }

    /* Trip list */
    .trips-list { display: flex; flex-direction: column; gap: .6rem; }
    .trip-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem 1.2rem; display: grid;
      grid-template-columns: 1fr auto; gap: .4rem .8rem; align-items: center;
    }
    .trip-main { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .trip-name { font-weight: 700; font-size: .92rem; white-space: nowrap; }
    .trip-pkg { font-size: .82rem; color: var(--muted); }
    .trip-return { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .trip-return strong { color: var(--ink); }

    .trip-side { display: flex; align-items: center; gap: .5rem; flex-wrap: nowrap; }
    .badge {
      font-size: .72rem; font-weight: 700; padding: .2rem .55rem;
      border-radius: 99px; white-space: nowrap;
    }
    .badge-pending { background: var(--amber-bg); color: var(--amber); }
    .badge-sent    { background: var(--green-bg); color: var(--green); }
    .badge-future  { background: var(--blue-bg); color: var(--blue); }
    .btn-delete { background: none; border: none; color: #dc2626; cursor: pointer;
      font-size: .8rem; padding: .3rem .5rem; border-radius: 6px; opacity: .6; }
    .btn-delete:hover { background: #fee2e2; opacity: 1; }

    /* Feedback approval panel */
    .approve-panel {
      grid-column: 1 / -1;
      background: var(--brand-light); border-radius: 10px;
      padding: 1rem 1.1rem; margin-top: .2rem;
      display: none;
    }
    .approve-panel.open { display: block; }
    .approve-panel p { font-size: .85rem; color: var(--ink); margin-bottom: .7rem; }
    .platform-checks { display: flex; gap: 1rem; margin-bottom: .8rem; flex-wrap: wrap; }
    .platform-checks label {
      display: flex; align-items: center; gap: .4rem;
      font-size: .85rem; font-weight: 500; cursor: pointer; color: var(--ink);
    }
    .platform-checks input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); }
    .approve-warning { font-size: .78rem; color: var(--muted); margin-bottom: .7rem; }
    .btn-approve { background: var(--green); color: #fff; border: none; border-radius: 8px;
      padding: .5rem 1rem; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .btn-approve:hover { background: #15803d; }
    .btn-approve:disabled { opacity: .5; cursor: not-allowed; }

    .empty-state { background: var(--white); border: 1px solid var(--border);
      border-radius: 12px; padding: 2.5rem; text-align: center; color: var(--muted); font-size: .9rem; }

    /* TC lookup row */
    .lookup-row { display: flex; gap: .5rem; align-items: flex-end; }
    .lookup-row input { flex: 1; }
    .btn-lookup { background: var(--brand); color: #fff; border: none; border-radius: 8px;
      padding: .6rem 1rem; font-size: .88rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-lookup:hover { background: var(--brand-dark); }
    .btn-lookup:disabled { opacity: .5; cursor: not-allowed; }
    .lookup-hint { font-size: .75rem; color: var(--muted); margin-top: .25rem; }

    /* Email preview */
    .email-preview { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px;
      padding: .9rem 1rem; margin: .6rem 0 .8rem; font-size: .82rem; line-height: 1.55;
      color: var(--ink); white-space: pre-wrap; font-family: inherit; display: none; }
    .email-preview.visible { display: block; }
    .preview-subject { font-weight: 700; font-size: .85rem; margin-bottom: .5rem; color: var(--ink); }
    .preview-to { font-size: .78rem; color: var(--muted); margin-bottom: .6rem; }
    .btn-preview { background: none; border: 1px solid var(--brand); color: var(--brand);
      border-radius: 8px; padding: .4rem .8rem; font-size: .82rem; cursor: pointer; margin-bottom: .6rem; }
    .btn-preview:hover { background: var(--brand-light); }

    /* Small no-review-link hint inside the send panel */
    .hint-no-link { font-size: .75rem; color: var(--muted); margin-top: .6rem; }
    .hint-no-link a { color: var(--muted); text-decoration: underline; }

    @media (max-width: 540px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      .trip-card { grid-template-columns: 1fr; }
      .trip-side { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/dashboard">
    <img src="/static/momira-logo.png" alt="Momira Travel">
    <span class="logo-text">Travel Agent Kit</span>
  </a>
  <div class="nav-right">
    <button class="btn-ghost" onclick="location.href='/settings'">Settings</button>
    <button class="btn-ghost" id="logout-btn">Log out</button>
  </div>
</nav>

<div class="page">
  <a class="back" href="/dashboard">← Dashboard</a>

  <div class="page-header">
    <div>
      <h1>✈️ Customer Trips</h1>
      <p>Add trips manually and send feedback emails after the customer returns.</p>
    </div>
    <button class="btn-brand" onclick="toggleAdd()">+ Add trip</button>
  </div>

  <!-- Add booking form -->
  <div class="add-card" id="add-card">
    <h2>Add new trip</h2>
    <form id="add-form">
      <div class="form-grid">
        <div class="full">
          <label>TC Booking Number <span style="color:var(--muted);font-weight:400">(auto-fills details below)</span></label>
          <div class="lookup-row">
            <input type="text" name="tc_booking_ref" id="tc-ref-input" placeholder="e.g. BNR-1014" autocomplete="off">
            <button type="button" class="btn-lookup" id="lookup-btn" onclick="lookupBooking()">Look up →</button>
          </div>
          <div class="lookup-hint" id="lookup-hint"></div>
        </div>
        <div>
          <label>First name <span class="req">*</span></label>
          <input type="text" name="first_name" id="field-first-name" required>
        </div>
        <div>
          <label>Last name <span class="req">*</span></label>
          <input type="text" name="last_name" id="field-last-name" required>
        </div>
        <div class="full">
          <label>Customer e-mail <span class="req">*</span></label>
          <input type="email" name="email" id="field-email" required>
        </div>
        <div class="full">
          <label>Trip / Package title <span style="color:var(--muted);font-weight:400">(auto-filled from BNR lookup)</span></label>
          <input type="text" name="package_title" id="field-package-title" placeholder="e.g. Bali Discovery 8 Days">
        </div>
        <div>
          <label>Holiday Package ID <span style="color:var(--muted);font-weight:400">(optional)</span></label>
          <input type="text" name="package_id" placeholder="e.g. 33959712">
        </div>
        <div>
          <label>Return date <span style="color:var(--muted);font-weight:400">(optional)</span></label>
          <input type="date" name="return_date" id="field-return-date">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-brand" id="add-submit-btn">Add to review list</button>
        <button type="button" class="btn-cancel" onclick="toggleAdd()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Trips list -->
  <div id="trips-container">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script>
  const token = localStorage.getItem('sk_token');
  if (!token) { window.location.href = '/'; }
  const headers = { 'Authorization': 'Bearer ' + token };

  let agentProfile = null;

  fetch('/me', { headers })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(a => {
      agentProfile = a;
      loadTrips();
    })
    .catch(() => { localStorage.removeItem('sk_token'); location.href = '/'; });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('sk_token'); location.href = '/';
  });

  function toggleAdd() {
    const c = document.getElementById('add-card');
    c.classList.toggle('open');
    if (c.classList.contains('open')) {
      document.getElementById('tc-ref-input').focus();
    }
  }

  async function lookupBooking() {
    const ref = document.getElementById('tc-ref-input').value.trim();
    if (!ref) { return; }
    const btn = document.getElementById('lookup-btn');
    const hint = document.getElementById('lookup-hint');
    btn.disabled = true; btn.textContent = 'Looking up…';
    hint.textContent = '';
    try {
      const r = await fetch('/api/bookings/lookup?ref=' + encodeURIComponent(ref), { headers });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        hint.textContent = '✗ ' + (d.detail || 'Booking not found');
        hint.style.color = '#dc2626';
        return;
      }
      const d = await r.json();
      if (d.first_name)     document.getElementById('field-first-name').value     = d.first_name;
      if (d.last_name)      document.getElementById('field-last-name').value      = d.last_name;
      if (d.email)          document.getElementById('field-email').value           = d.email;
      if (d.return_date)    document.getElementById('field-return-date').value    = d.return_date;
      if (d.package_title)  document.getElementById('field-package-title').value  = d.package_title;
      hint.textContent = '✓ Details filled in from TC booking';
      hint.style.color = 'var(--green)';
    } catch(err) {
      hint.textContent = '✗ Lookup failed: ' + err.message;
      hint.style.color = '#dc2626';
    } finally {
      btn.disabled = false; btn.textContent = 'Look up →';
    }
  }

  document.getElementById('add-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('add-submit-btn');
    btn.disabled = true; btn.textContent = 'Adding…';
    const fd = new FormData(e.target);
    try {
      const r = await fetch('/api/bookings', { method: 'POST', headers, body: fd });
      if (!r.ok) throw new Error(await r.text());
      e.target.reset();
      document.getElementById('add-card').classList.remove('open');
      await loadTrips();
    } catch(err) { alert('Error: ' + err.message); }
    btn.disabled = false; btn.textContent = 'Add to review list';
  });

  async function loadTrips() {
    const r = await fetch('/api/bookings', { headers });
    const trips = await r.json();
    const c = document.getElementById('trips-container');
    if (!trips.length) {
      c.innerHTML = '<div class="empty-state">No trips yet — add your first one above.</div>';
      return;
    }
    const today = new Date().toISOString().slice(0, 10);
    c.innerHTML = '<div class="trips-list">' + trips.map(t => renderTrip(t, today)).join('') + '</div>';
  }

  function renderTrip(t, today) {
    const name = esc(t.first_name) + ' ' + esc(t.last_name);
    const pkg = t.package_title ? esc(t.package_title) : (t.package_id ? 'Package ' + esc(t.package_id) : '—');
    const retDate = t.return_date || null;

    // Sent trips: hide from list (clean slate)
    if (t.feedback_status === 'sent') return '';

    let badge, showApprove;
    if (!retDate || retDate > today) {
      badge = '<span class="badge badge-future">Upcoming</span>';
      showApprove = false;
    } else {
      badge = '<span class="badge badge-pending">Due</span>';
      showApprove = true;
    }

    const retStr = retDate
      ? '<span class="trip-return">↩ <strong>' + fmtDate(retDate) + '</strong></span>'
      : '';

    const hasAgentLink = agentProfile && (agentProfile.google_review_url || agentProfile.tripadvisor_url);
    const noLinkHint = !hasAgentLink
      ? '<p class="hint-no-link">No review link from you yet — <a href="/settings">go to Settings</a> to add one.</p>'
      : '';

    const approvePanel = showApprove ? `
      <div class="approve-panel" id="panel-${t.id}" style="grid-column:1/-1">
        <p><strong>${esc(t.first_name)}</strong> is back! Choose review platforms and send the feedback email.</p>
        <div class="platform-checks">
          ${agentProfile && agentProfile.google_review_url ? '<label><input type="checkbox" checked value="google" class="plat-' + t.id + '" onchange="refreshPreview(\'' + t.id + '\')"> Google</label>' : ''}
          ${agentProfile && agentProfile.tripadvisor_url ? '<label><input type="checkbox" value="tripadvisor" class="plat-' + t.id + '" onchange="refreshPreview(\'' + t.id + '\')"> TripAdvisor</label>' : ''}
          <label style="color:var(--muted);cursor:default"><input type="checkbox" checked disabled> Momira Travel Google</label>
        </div>
        <div id="preview-${t.id}" class="email-preview"></div>
        <div class="approve-warning">The email will be sent to ${esc(t.email)} immediately after you click Send now.</div>
        ${noLinkHint}
        <button class="btn-approve" id="send-btn-${t.id}" onclick="sendFeedback('${t.id}')">✉ Send now</button>
      </div>` : '';

    const actionBtns = showApprove
      ? `<button class="btn-ghost" style="font-size:.78rem" onclick="togglePanel('${t.id}')">👁 Show preview</button>
         <button class="btn-delete" title="Delete booking" onclick="deleteTrip('${t.id}')">✕</button>`
      : `<button class="btn-delete" title="Delete booking" onclick="deleteTrip('${t.id}')">✕</button>`;

    return `<div class="trip-card">
      <div class="trip-main">
        <span class="trip-name">${name}</span>
        <span class="trip-pkg">${pkg}</span>
        ${retStr}
      </div>
      <div class="trip-side">
        ${badge}
        ${actionBtns}
      </div>
      ${approvePanel}
    </div>`;
  }

  function togglePanel(id) {
    const p = document.getElementById('panel-' + id);
    if (!p) return;
    const wasOpen = p.classList.contains('open');
    p.classList.toggle('open');
    if (!wasOpen) showPreview(id);
  }

  function refreshPreview(id) { showPreview(id); }

  async function showPreview(id) {
    const checks = document.querySelectorAll('.plat-' + id + ':checked');
    const platforms = Array.from(checks).map(c => c.value).join(',') || 'google';
    const box = document.getElementById('preview-' + id);
    box.innerHTML = '<em style="color:var(--muted)">Loading preview…</em>';
    box.classList.add('visible');
    try {
      const r = await fetch('/api/bookings/' + id + '/preview-email?platforms=' + encodeURIComponent(platforms), { headers });
      if (!r.ok) throw new Error(await r.text());
      const d = await r.json();
      box.innerHTML =
        '<div class="preview-to">To: ' + esc(d.to_email) + '</div>' +
        '<div class="preview-subject">Subject: ' + esc(d.subject) + '</div>' +
        '<pre style="white-space:pre-wrap;font-family:inherit;font-size:.82rem;margin:0">' + esc(d.body) + '</pre>';
    } catch(err) {
      box.innerHTML = '<span style="color:#dc2626">Could not load preview: ' + esc(err.message) + '</span>';
    }
  }

  async function sendFeedback(id) {
    const checks = document.querySelectorAll('.plat-' + id + ':checked');
    const platforms = Array.from(checks).map(c => c.value).join(',') || 'google';
    const btn = event.target;
    btn.disabled = true; btn.textContent = 'Sending…';
    const fd = new FormData();
    fd.append('platforms', platforms);
    try {
      const r = await fetch('/api/bookings/' + id + '/send-feedback', { method: 'POST', headers, body: fd });
      if (!r.ok) {
        const d = await r.json();
        throw new Error(d.detail || 'Failed');
      }
      await loadTrips();
    } catch(err) {
      alert('Error: ' + err.message);
      btn.disabled = false; btn.textContent = '✉ Send now';
    }
  }

  async function deleteTrip(id) {
    if (!confirm('Remove this booking from the review list?')) return;
    try {
      const r = await fetch('/api/bookings/' + id, { method: 'DELETE', headers });
      if (!r.ok) throw new Error(await r.text());
      await loadTrips();
    } catch(err) { alert('Error: ' + err.message); }
  }

  function fmtDate(iso) {
    const d = new Date(iso + 'T12:00:00Z');
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
