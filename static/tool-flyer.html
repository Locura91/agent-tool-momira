<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Agent Kit — Travel Flyer</title>
  <style>
    :root {
      --brand: #17a39b; --brand-dark: #128a81; --brand-light: #e6f7f6;
      --ink: #111827; --muted: #6b7280; --border: #e5e7eb;
      --bg: #f9fafb; --white: #ffffff; --red: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

    nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--ink); }
    .logo-mark { width: 32px; height: 32px; background: var(--brand); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .9rem; }
    .logo-text { font-weight: 700; font-size: 1rem; }
    .nav-back { font-size: .85rem; color: var(--muted); cursor: pointer; background: none; border: 1px solid var(--border); border-radius: 8px; padding: .4rem .8rem; }

    .page { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; }
    .page-header p { color: var(--muted); font-size: .9rem; margin-top: .3rem; }

    /* ── Controls card ── */
    .controls-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.3rem 1.5rem; margin-bottom: 1.5rem;
      display: flex; flex-direction: column; gap: 1.1rem;
    }
    .controls-row { display: flex; gap: .75rem; align-items: flex-end; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: .35rem; flex: 1; min-width: 160px; }
    .field label { font-size: .82rem; font-weight: 600; color: var(--ink); }
    .field input {
      padding: .6rem .9rem; border: 1px solid var(--border); border-radius: 8px;
      font-size: .9rem; color: var(--ink); outline: none; transition: border-color .15s;
      background: var(--white);
    }
    .field input:focus { border-color: var(--brand); }

    /* Style toggle */
    .style-toggle { display: flex; flex-direction: column; gap: .35rem; }
    .style-toggle label { font-size: .82rem; font-weight: 600; }
    .style-btns { display: flex; gap: .6rem; }
    .style-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: .25rem;
      padding: .6rem .9rem; border: 1.5px solid var(--border); border-radius: 10px;
      font-size: .82rem; font-weight: 700; cursor: pointer; background: var(--white);
      color: var(--ink); transition: all .15s; min-width: 130px; text-align: left;
    }
    .style-btn .sname { font-size: .82rem; font-weight: 700; }
    .style-btn .sdesc { font-size: .72rem; font-weight: 400; color: #6b7280; line-height: 1.3; }
    .style-btn .sthumb { width: 100%; height: 28px; border-radius: 4px; margin-bottom: .1rem; display: flex; gap: 2px; overflow: hidden; }
    .style-btn .sthumb span { display: block; border-radius: 2px; }
    .style-btn.active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }
    .style-btn.active .sdesc { color: var(--brand); }
    .style-btn:hover:not(.active) { border-color: var(--brand); }
    .qr-check { display: flex; align-items: center; gap: .45rem; font-size: .85rem; font-weight: 500; color: var(--ink); cursor: pointer; padding: .55rem 0; }
    .qr-check input { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }

    .btn-generate {
      background: var(--brand); color: #fff; border: none; border-radius: 8px;
      padding: .65rem 1.4rem; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s; white-space: nowrap; align-self: flex-end;
    }
    .btn-generate:hover { background: var(--brand-dark); }
    .btn-generate:disabled { opacity: .6; cursor: not-allowed; }

    .error { background: #fef2f2; border: 1px solid #fca5a5; color: var(--red); border-radius: 8px; padding: .6rem .9rem; font-size: .85rem; margin-bottom: 1rem; display: none; }

    /* Preview */
    .preview-wrap { display: none; }
    .preview-actions { display: flex; gap: .75rem; margin-bottom: 1.2rem; align-items: center; flex-wrap: wrap; }
    .preview-actions .info { font-size: .85rem; color: var(--muted); flex: 1; }
    .btn-print { background: var(--brand); color: #fff; border: none; border-radius: 8px; padding: .6rem 1.2rem; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .btn-print:hover { background: var(--brand-dark); }
    .btn-open { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: .6rem 1.2rem; font-size: .9rem; font-weight: 600; cursor: pointer; color: var(--ink); }
    .style-switch-btns { display: flex; gap: .45rem; }
    .style-switch-btn {
      padding: .45rem .9rem; border: 1px solid var(--border); border-radius: 7px;
      font-size: .8rem; font-weight: 600; cursor: pointer; background: var(--white); color: var(--muted);
    }
    .style-switch-btn.active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }

    .flyer-preview-box {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    .flyer-preview-box iframe { width: 100%; border: none; display: block; min-height: 500px; }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/dashboard">
    <img src="/static/momira-logo.png" alt="Momira Travel" style="height:36px;width:36px;border-radius:50%;display:block;object-fit:contain">
    <span class="logo-text">Travel Agent Kit</span>
  </a>
  <button class="nav-back" onclick="history.back()">← Dashboard</button>
</nav>

<div class="page">
  <div class="page-header">
    <h1>📄 Travel Flyer</h1>
    <p>Enter a Package ID, choose a style, then print or save as PDF straight from the browser.</p>
  </div>

  <div class="error" id="error-box"></div>

  <div class="controls-card">
    <!-- Row 1: Package ID + style + generate -->
    <div class="controls-row">
      <div class="field">
        <label for="pkg-id">Package ID or URL</label>
        <input type="text" id="pkg-id" placeholder="e.g. 64797496 or https://momira.travel/…" autocomplete="off">
      </div>

      <div class="style-toggle">
        <label>Flyer style</label>
        <div class="style-btns">
          <button class="style-btn active" data-style="a" onclick="setStyle('a')">
            <div class="sthumb">
              <span style="flex:1;background:#0d2137;"></span>
              <span style="flex:2;background:#e8f4f3;display:flex;flex-direction:column;gap:2px;padding:3px;">
                <span style="height:4px;background:#17a39b;border-radius:1px;display:block;"></span>
                <span style="height:3px;background:#ccc;border-radius:1px;display:block;width:70%;"></span>
              </span>
            </div>
            <span class="sname">Portrait — Classic</span>
            <span class="sdesc">Full photo · bold headline · dark CTA band</span>
          </button>
          <button class="style-btn" data-style="b" onclick="setStyle('b')">
            <div class="sthumb">
              <span style="flex:3;background:#e8f4f3;display:flex;flex-direction:column;gap:2px;padding:3px;">
                <span style="height:4px;background:#17a39b;border-radius:1px;display:block;"></span>
                <span style="height:3px;background:#ccc;border-radius:1px;display:block;width:80%;"></span>
              </span>
              <span style="flex:1;background:#f0faf9;border-left:2px solid #17a39b;padding:3px;display:flex;flex-direction:column;gap:2px;">
                <span style="height:3px;background:#17a39b;border-radius:1px;display:block;"></span>
                <span style="height:3px;background:#ccc;border-radius:1px;display:block;"></span>
              </span>
            </div>
            <span class="sname">Portrait — Magazine</span>
            <span class="sdesc">Two-column · sidebar with price &amp; contact</span>
          </button>
          <button class="style-btn" data-style="c" onclick="setStyle('c')">
            <div class="sthumb" style="flex-direction:column;gap:2px;">
              <span style="flex:2;background:#0d2137;border-radius:2px;display:block;"></span>
              <span style="flex:1;background:#e8f4f3;border-radius:2px;display:flex;gap:3px;padding:2px;">
                <span style="flex:1;background:#ccc;border-radius:1px;display:block;"></span>
                <span style="flex:1;background:#ccc;border-radius:1px;display:block;"></span>
                <span style="flex:1;background:#17a39b;border-radius:1px;display:block;"></span>
              </span>
            </div>
            <span class="sname">Landscape — Panoramic</span>
            <span class="sdesc">Wide format · ideal for screens &amp; window displays</span>
          </button>
        </div>
      </div>

      <div class="style-toggle">
        <label>QR code</label>
        <label class="qr-check"><input type="checkbox" id="qr-toggle"> Add QR code to website</label>
      </div>

      <button class="btn-generate" id="gen-btn">Generate Flyer →</button>
    </div>
  </div>

  <div class="preview-wrap" id="preview-wrap">
    <div class="preview-actions">
      <span class="info">✅ Flyer ready — press <strong>Ctrl+P</strong> (⌘P on Mac) to print or save as PDF.</span>
      <div class="style-switch-btns">
        <button class="style-switch-btn active" id="sw-a" onclick="switchStyle('a')">Classic</button>
        <button class="style-switch-btn" id="sw-b" onclick="switchStyle('b')">Magazine</button>
        <button class="style-switch-btn" id="sw-c" onclick="switchStyle('c')">Landscape</button>
      </div>
      <button class="btn-open" id="btn-open-tab">Open in new tab ↗</button>
      <button class="btn-print" id="btn-print">🖨 Print / Save PDF</button>
    </div>
    <div class="flyer-preview-box">
      <iframe id="flyer-frame" title="Flyer preview"></iframe>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem('sk_token');
  if (!token) window.location.href = '/';
  const H = { 'Authorization': 'Bearer ' + token };

  let currentStyle = 'a';
  let currentPkgId = '';

  function setStyle(s) {
    currentStyle = s;
    document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.style === s));
  }

  function switchStyle(s) {
    currentStyle = s;
    document.querySelectorAll('.style-switch-btn').forEach(b => b.classList.toggle('active', b.id === 'sw-' + s));
    if (currentPkgId) loadFlyer(currentPkgId, s);
  }

  function showError(msg) { const el = document.getElementById('error-box'); el.textContent = msg; el.style.display = 'block'; }
  function hideError() { document.getElementById('error-box').style.display = 'none'; }

  document.getElementById('gen-btn').addEventListener('click', generate);
  document.getElementById('pkg-id').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
  document.getElementById('qr-toggle').addEventListener('change', () => { if (currentPkgId) loadFlyer(currentPkgId, currentStyle); });

  function extractPackageId(raw) {
    // Accept a bare ID like "64800076" or a full package URL from any site:
    //   https://momira.travel/es/idea/64800076/3-days-bush-camp-safari
    //   https://book.multiwander.com/en/package/64800076/...
    //   ...?id=64800076 / ?pkg=64800076
    raw = (raw || '').trim();
    let m = raw.match(/\/(?:idea|package|paquete|pacchetto|reise|holiday|tour)\/(\d{4,})/i);
    if (m) return m[1];
    m = raw.match(/[?&](?:id|pkg|package|idea)=(\d{4,})/i);
    if (m) return m[1];
    // Otherwise take the longest run of >=5 digits (TC IDs are ~8 digits),
    // so slug numbers like "3-days" don't get picked up.
    const runs = raw.match(/\d{5,}/g);
    if (runs) return runs.sort((a, b) => b.length - a.length)[0];
    const digitsOnly = raw.replace(/\D/g, '');
    return digitsOnly || raw;
  }

  async function generate() {
    hideError();
    const rawInput = document.getElementById('pkg-id').value.trim();
    if (!rawInput) { showError('Please enter a Package ID or URL.'); return; }
    const pkgId = extractPackageId(rawInput);

    const btn = document.getElementById('gen-btn');
    btn.disabled = true; btn.textContent = 'Generating…';

    try {
      await loadFlyer(pkgId, currentStyle);
      currentPkgId = pkgId;
      document.getElementById('preview-wrap').style.display = 'block';
      document.getElementById('preview-wrap').scrollIntoView({ behavior: 'smooth' });
      // sync switch buttons
      document.querySelectorAll('.style-switch-btn').forEach(b => b.classList.toggle('active', b.id === 'sw-' + currentStyle));
    } catch (err) {
      showError(err.message || 'Could not generate flyer.');
    } finally {
      btn.disabled = false; btn.textContent = 'Generate Flyer →';
    }
  }

  function qrOn() { return document.getElementById('qr-toggle').checked ? '1' : '0'; }

  async function loadFlyer(pkgId, style) {
    const res = await fetch(`/generate/${pkgId}/flyer?style=${style}&qr=${qrOn()}`, { headers: H });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || 'Could not generate flyer.');
    }
    const html = await res.text();
    const frame = document.getElementById('flyer-frame');
    frame.srcdoc = html;
    frame.style.minHeight = style === 'c' ? '640px' : '860px';
  }

  document.getElementById('btn-open-tab').addEventListener('click', () => {
    if (!currentPkgId) return;
    window.open(`/generate/${currentPkgId}/flyer?style=${currentStyle}&qr=${qrOn()}&token=${encodeURIComponent(token)}`, '_blank');
  });

  document.getElementById('btn-print').addEventListener('click', () => {
    const frame = document.getElementById('flyer-frame');
    if (frame.contentWindow) frame.contentWindow.print();
  });
</script>
</body>
</html>
